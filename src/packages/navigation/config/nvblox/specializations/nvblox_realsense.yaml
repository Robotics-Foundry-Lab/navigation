/**:
  ros__parameters:
    # Lidar settings
    use_lidar: false
    # QoS settings
    input_qos: "SENSOR_DATA"
    # Map clearing settings
    map_clearing_frame_id: "base_footprint"
    # Rviz visualization
    esdf_slice_bounds_visualization_attachment_frame_id: "base_footprint"
    # A voxel only counts as obstacle if its centre lies behind the measured surface. With the base
    # 0.07 m, ~5 cm thin chair legs often had no voxel centre inside and were mapped as free
    # (45% of the leg points at 3-7 cm height missing). A single-frame model predicts ~2x the
    # coverage of low points at 0.05 m and no further gain below that.
    voxel_size: 0.05

    static_mapper:
      # Voxels within this distance (in voxels) of a surface count as obstacle. The base value
      # 2.0 (0.14 m) made walls appear ~15 cm closer than they are and trapped the robot.
      # Voxels behind a surface always count, so 0.5 does not open holes in walls.
      esdf_integrator_max_site_distance_vox: 0.5
      esdf_slice_height: 0.1
      # Expected to be tuned by users. Slice height depends on realsense mounting.
      # The slice starts at the voxel layer containing this height: 0.03 keeps the floor-level
      # layer (0-5 cm with 0.05 m voxels) like 0.05 did with 0.07 m voxels (0-7 cm).
      esdf_slice_min_height: 0.03
      esdf_slice_max_height: 0.2

    dynamic_mapper:
      esdf_slice_height: 0.1
      esdf_slice_min_height: 0.05
      esdf_slice_max_height: 0.2
